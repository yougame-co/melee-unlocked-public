name: Bug report
description: Something in the port crashes, freezes, desyncs or looks wrong
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Port version
      description: The version from the zip name or the window title
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where
      options: [Boot or menus, Offline match, Slippi online, Graphics or DLSS, Audio, Controller, Performance, Other]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Character, stage, what you pressed, whether it happens every time
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected and what happened instead
  - type: input
    id: gpu
    attributes:
      label: GPU, driver version, monitor refresh rate
  - type: textarea
    id: log
    attributes:
      label: Logs
      description: >-
        Easiest: press Send logs in the launcher, describe the bug there, and write "sent from the
        launcher" here. Or attach two files from the folder that holds MeleeUnlockedLauncher.exe
        (on Linux, the folder with MeleeUnlocked): melee_port.log and port-settings.ini. With file
        extensions hidden, Windows shows them as "melee_port" (a text document) and "port-settings"
        (configuration settings). Attach a .slp replay if the bug is in a match.
      render: text
